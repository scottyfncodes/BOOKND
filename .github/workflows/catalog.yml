name: Catalog
# Builds the Discover catalog from the official bulk sources and publishes it as release assets
# (tag "catalog-latest"), which BookNd's server loads for full-catalog search. No secrets are used:
# every source is public, and the job only writes to this repository's releases.
on:
  schedule:
    - cron: '17 6 * * *' # daily; Gutenberg is skipped when its catalog file hasn't changed
  workflow_dispatch:
    inputs:
      ratings_budget:
        description: 'Max Open Library id batches (100 books each) this run'
        default: '900'
      search_budget:
        description: 'Max Open Library title/author lookups this run'
        default: '500'
      skip_ratings:
        description: 'Skip ratings (1 to skip)'
        default: '0'
  pull_request:
    paths: ['scripts/catalog/**', '.github/workflows/catalog.yml']

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Previous snapshot (for incremental updates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          gh release download catalog-latest -D prev -p state.json.gz -p meta.json --repo "$GITHUB_REPOSITORY" || echo "No previous snapshot; building from scratch"
          ls -la prev
      - name: Build catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RATINGS_BUDGET: ${{ github.event_name == 'pull_request' && '2' || inputs.ratings_budget || '900' }}
          SEARCH_BUDGET: ${{ github.event_name == 'pull_request' && '5' || inputs.search_budget || '500' }}
          SKIP_RATINGS: ${{ inputs.skip_ratings || '0' }}
        run: node scripts/catalog/build.mjs --prev prev --out out
      - name: Keep the run's output
        uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ github.run_id }}
          path: out/meta.json
          retention-days: 30
      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view catalog-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create catalog-latest --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Catalog snapshot (automated)" \
              --notes "Machine-built Discover catalog: Project Gutenberg + Standard Ebooks metadata and Open Library ratings. Rebuilt daily by .github/workflows/catalog.yml."
          # data first, pointer (meta.json) last: the server reloads only after meta.json changes
          gh release upload catalog-latest out/catalog.json.gz out/state.json.gz --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload catalog-latest out/meta.json --clobber --repo "$GITHUB_REPOSITORY"
